<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin &amp; Pengawas — CBT Sekolah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- ===================================================================== -->
  <!-- LAYAR LOGIN ADMIN / PENGAWAS                                          -->
  <!-- ===================================================================== -->
  <div id="admin-login-screen" class="min-h-screen flex items-center justify-center p-4 no-print">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
      <div class="bg-slate-900 p-6 text-white text-center border-b-4 border-blue-600">
        <h1 class="text-xl font-extrabold">Panel Admin &amp; Pengawas CBT</h1>
        <p class="text-xs text-slate-400 mt-1">Masuk menggunakan akun guru/admin terdaftar di Supabase Auth</p>
      </div>
      <form id="form-admin-login" class="p-6 space-y-4">
        <div id="admin-login-err" class="hidden p-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm font-medium"></div>
        <div>
          <label for="admin-email" class="block text-xs font-bold uppercase text-slate-600 mb-1">Email Admin / Pengawas</label>
          <input type="email" id="admin-email" required placeholder="admin@sekolah.sch.id"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none" />
        </div>
        <div>
          <label for="admin-password" class="block text-xs font-bold uppercase text-slate-600 mb-1">Kata Sandi</label>
          <input type="password" id="admin-password" required placeholder="••••••••"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none" />
        </div>
        <button type="submit" id="btn-admin-login"
          class="w-full py-3 rounded-xl bg-blue-700 hover:bg-blue-800 disabled:bg-slate-400 text-white font-extrabold text-sm shadow transition">
          Masuk ke Dashboard
        </button>
        <div class="text-center pt-2 border-t border-slate-100">
          <a href="index.html" class="text-xs text-slate-500 hover:text-blue-700 font-semibold">&larr; Kembali ke Halaman Login Siswa</a>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- DASHBOARD SHELL ADMIN (7 MENU)                                        -->
  <!-- ===================================================================== -->
  <div id="admin-dashboard" class="hidden min-h-screen flex-col lg:flex-row no-print">
    <!-- Sidebar Navigasi -->
    <aside class="w-full lg:w-64 bg-slate-900 text-slate-200 flex flex-col shrink-0">
      <div class="p-5 border-b border-slate-800">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-black text-white text-xs">CBT</div>
          <div class="font-extrabold text-white text-sm tracking-wide">ADMIN PANEL</div>
        </div>
        <div id="sidebar-school-name" class="text-xs text-slate-400 truncate mt-1.5">Memuat sekolah...</div>
        <div id="sidebar-admin-email" class="text-[11px] text-blue-400 truncate mt-0.5"></div>
      </div>

      <nav class="flex-1 p-3 space-y-1 overflow-x-auto flex lg:flex-col">
        <button type="button" data-tab="sekolah" class="nav-btn text-left px-3.5 py-2.5 rounded-xl text-sm font-semibold text-slate-300 hover:bg-slate-800 whitespace-nowrap">
          1. Identitas Sekolah
        </button>
        <button type="button" data-tab="mapel" class="nav-btn text-left px-3.5 py-2.5 rounded-xl text-sm font-semibold text-slate-300 hover:bg-slate-800 whitespace-nowrap">
          2. Mata Pelajaran
        </button>
        <button type="button" data-tab="kelas" class="nav-btn text-left px-3.5 py-2.5 rounded-xl text-sm font-semibold text-slate-300 hover:bg-slate-800 whitespace-nowrap">
          3. Kelas &amp; Siswa
        </button>
        <button type="button" data-tab="soal" class="nav-btn text-left px-3.5 py-2.5 rounded-xl text-sm font-semibold text-slate-300 hover:bg-slate-800 whitespace-nowrap">
          4. Bank Soal
        </button>
        <button type="button" data-tab="pengawas" class="nav-btn text-left px-3.5 py-2.5 rounded-xl text-sm font-semibold bg-blue-700 text-white whitespace-nowrap">
          5. Ruang Pengawas
        </button>
        <button type="button" data-tab="ujian" class="nav-btn text-left px-3.5 py-2.5 rounded-xl text-sm font-semibold text-slate-300 hover:bg-slate-800 whitespace-nowrap">
          6. Kelola Ujian
        </button>
        <button type="button" data-tab="nilai" class="nav-btn text-left px-3.5 py-2.5 rounded-xl text-sm font-semibold text-slate-300 hover:bg-slate-800 whitespace-nowrap">
          7. Rekap Nilai &amp; Uraian
        </button>
      </nav>

      <div class="p-4 border-t border-slate-800">
        <button type="button" id="btn-logout-admin" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-red-700 text-xs font-bold text-slate-300 hover:text-white transition">
          Keluar Akun Admin
        </button>
      </div>
    </aside>

    <!-- Konten Utama (Di-render dinamis oleh modul js/admin/*.js) -->
    <main class="flex-1 p-4 md:p-6 overflow-y-auto">
      <section id="tab-sekolah" class="tab-section hidden space-y-5"></section>
      <section id="tab-mapel" class="tab-section hidden space-y-5"></section>
      <section id="tab-kelas" class="tab-section hidden space-y-5"></section>
      <section id="tab-soal" class="tab-section hidden space-y-5"></section>
      <section id="tab-pengawas" class="tab-section space-y-5"></section>
      <section id="tab-ujian" class="tab-section hidden space-y-5"></section>
      <section id="tab-nilai" class="tab-section hidden space-y-5"></section>
    </main>
  </div>

  <!-- Area Cetak Kartu Peserta A4 -->
  <div id="print-kartu-area" class="hidden p-6 bg-white"></div>

  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/admin/sekolah.js"></script>
  <script src="js/admin/mapel.js"></script>
  <script src="js/admin/kelas.js"></script>
  <script src="js/admin/bank-soal.js"></script>
  <script src="js/admin/pengawas.js"></script>
  <script src="js/admin/kelola-ujian.js"></script>
  <script src="js/admin/rekap-nilai.js"></script>
  <script src="js/admin/shell.js"></script>
</body>
</html>
